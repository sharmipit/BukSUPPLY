<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BukSUPPLY | Sign In</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="icon" type="image/png" href="../assets/img/favicon.ico">
  <link rel="stylesheet" href="../assets/css/signin.css">
</head>
<body>

  <main class="login-wrapper">
    <div class="login-card">
      
      <a href="../index.html" class="back-link">
        <i class="bi bi-arrow-left"></i> Go Back
      </a>

      <!-- Header Section -->
      <header class="login-header">
        <h1 class="login-title">Log in to your <span>account</span></h1>
        <p class="login-subtitle">Welcome! Enter your credentials to access <strong>BukSUPPLY</strong></p>
      </header>

      <!-- Role Selection Segmented Control -->
      <div class="role-selector" role="tablist" aria-label="Account Role Selection">
        <button type="button" class="role-tab active" data-role="user" id="tab-user">Users</button>
        <button type="button" class="role-tab" data-role="staff" id="tab-staff">Staff</button>
        <button type="button" class="role-tab" data-role="admin" id="tab-admin">Administrator</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="login-form">
        <!-- Hidden input to store current selected role -->
        <input type="hidden" id="selectedRole" name="role" value="user">

        <!-- Email Address -->
        <div class="form-group">
          <label for="email" class="form-label">
            <i class="bi bi-envelope-fill"></i> Email Address
          </label>
          <input 
            type="email" 
            id="email" 
            class="form-input" 
            placeholder="e.g. user@buksu.edu.ph" 
            required
          >
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password" class="form-label">
            <i class="bi bi-lock-fill"></i> Password
          </label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="Enter your password" 
            required
          >
          <div class="forgot-wrapper">
            <a href="#" class="forgot-link">Forgot Password</a>
          </div>
        </div>

        <!-- Notification Banner -->
        <div id="alertBanner" class="alert-banner hidden"></div>

        <!-- Submit Button -->
        <div class="btn-wrapper">
          <button type="submit" class="btn-submit">Log In</button>
        </div>
      </form>

      <!-- SSO / Google Section -->
      <div class="social-section" id="socialSection">
        <div class="divider">
          <span>or Log In with</span>
        </div>
        
        <!-- Brown-themed Full Google Button -->
        <button type="button" class="sso-google-btn" id="googleSsoBtn">
          <i class="bi bi-google"></i>
          <span>Continue with Google</span>
        </button>
      </div>

      <!-- Footer Account Link -->
      <div class="login-footer" id="signupFooter">
        <p>Don’t have an account? <a href="signup.html" class="create-account-link">Create Account</a></p>
      </div>

    </div>
  </main>

  <!-- Interactive Script -->
  <script src="../assets/js/signin.js"></script>
</body>
</html>
